config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FG-ATLANTA"
    set timezone 28
end

config system interface
    edit "port1"
        set mode static
        set vdom "root"
        set ip 1.1.2.2 255.255.255.0
        set allowaccess ping https ssh http fgfm
        set type physical
        set alias "ISP1"
    next
    edit "port2"
     set mode static
        set vdom "root"
        set ip 2.2.2.2 255.255.255.0
        set allowaccess ping ssh http
        set type physical
        set alias "ISP2"
    next
    edit "port10"
        set mode static
        set vdom "root"
        set ip 192.168.2.1 255.255.255.0
        set allowaccess ping ssh http
        set type physical
        set alias "LAN"
    next
end

config router static
    edit 1
        set gateway 1.1.2.1
        set device "port1"
        set comment "route par defaut pour internet"
    next
    edit 2
        set gateway 2.2.2.1
        set device "port2"
        set comment "route par defaut pour internet"
    next
end

config firewall policy
    edit 1
        set name "LAN  vers Internet"
        set srcintf "port10"
        set dstintf "port1" "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end

config vpn ipsec phase1-interface
    edit "VPN-ISP1"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device enable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set add-route disable
        set localid "FG-ATLANTA-ISP1"
        set dpd on-idle
        set auto-discovery-receiver enable
        set network-overlay enable
        set network-id 1
        set remote-gw 1.1.0.2
        set psksecret chutjesuisuneclesecrete
    next
    edit "VPN-ISP2"
        set interface "port2"
        set ike-version 2
        set peertype any
        set net-device enable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set add-route disable
        set localid "FG-ATLANTA-ISP2"
        set dpd on-idle
        set auto-discovery-receiver enable
        set network-overlay enable
        set network-id 2
        set remote-gw 2.2.0.2
        set psksecret chutjesuisuneclesecrete
    next
end

config system interface
    edit "VPN-ISP1"
        set vdom "root"
        set allowaccess ping
        set type tunnel
        set interface "port1"
    next
    edit "VPN-ISP2"
        set vdom "root"
        set allowaccess ping
        set type tunnel
        set interface "port2"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-ISP1"
        set phase1name "VPN-ISP1"
        set proposal des-sha1 des-sha256
    next
    edit "VPN-ISP2"
        set phase1name "VPN-ISP2"
        set proposal des-sha1 des-sha256
    next
end

config firewall policy
    edit 2
        set name "LAN vers VPNs"
        set srcintf "port10"
        set dstintf  "VPN-ISP1" "VPN-ISP2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "VPNs vers LAN"
        set dstintf "port10"
        set srcintf  "VPN-ISP1" "VPN-ISP2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end

config router route-map
    edit "sla-fail"
        config rule
            edit 1
                set set-community "65000:11"
            next
        end
    next
    edit "hub_isp"
        config rule
            edit 1
                set set-community "65000:1"
            next
        end
    next
    edit "hub_isp2"
        config rule
            edit 1
                set set-community "65000:2"
            next
        end
    next
end

config router bgp
    set as 65000
    set router-id 192.168.2.1
    set keepalive-timer 3
    set holdtime-timer 9
    set ibgp-multipath enable
    set additional-path enable
    set additional-path-select 2
    config neighbor
        edit "10.254.1.254"
            set advertisement-interval 1
            set soft-reconfiguration enable
            set interface "VPN-ISP1"
            set remote-as 65000
            set route-map-out "sla-fail"
            set route-map-out-preferable "hub_isp"
            set connect-timer 1
            set update-source "VPN-ISP1"
            set additional-path receive
        next
        edit "10.254.2.254"
            set advertisement-interval 1
            set soft-reconfiguration enable
            set interface "VPN-ISP2"
            set remote-as 65000
            set route-map-out "sla-fail"
            set route-map-out-preferable "hub_isp2"
            set connect-timer 1
            set update-source "VPN-ISP2"
            set additional-path receive
        next
    end
    config network
        edit 1
            set prefix 192.168.2.0 255.255.255.0
        next
    end
end

config firewall address
    edit "srv1"
        set subnet 192.168.0.2 255.255.255.255
    next
    edit "192.168.0.0"
        set subnet 192.168.0.0 255.255.0.0
    next
end

config firewall policy
purge
y
end

config router static
    delete 1
    delete 2
end

conf system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end

    config members
        edit 1
            set interface "VPN-ISP1"
        next
        edit 2
            set interface "VPN-ISP2"
            set cost 50
        next
        edit 3
            set interface "port1"
            set gateway 1.1.2.1
        next
        edit 4
            set interface "port2"
            set gateway 2.2.2.1
        next
    end
    config health-check
        edit "srv1"
            set server "192.168.0.2"
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 50
                    set jitter-threshold 10
                next
            end
        next
    edit "hub_sla"
        set server "192.168.0.1"
        set update-static-route disable
        set members 1 2
        config sla
            edit 1
                set latency-threshold 100
                set jitter-threshold 30
                set packetloss-threshold 3
            next
        end
    next

    edit "Default_Google Search"
        set server "8.8.8.8"
        set protocol ping
        set interval 1000
        set probe-timeout 1000
        set recoverytime 10
        set members 0
        config sla
            edit 1
                set latency-threshold 50
                set jitter-threshold 50
                set packetloss-threshold 5
            next
        end
    next
end

config neighbor
    edit "10.254.1.254"
        set member 1
        set health-check "hub_sla"
        set sla-id 1
    next
    edit "10.254.2.254"
        set member 2
        set health-check "hub_sla"
        set sla-id 1
    next
end
    config service
        edit 1
            set name "lan-DC"
            set mode priority
            set dst "srv1"
            set health-check "srv1"
            set priority-members 1 2
        next
        edit 2
            set name "gmail"
            set priority-members 3
            set internet-service enable
            set internet-service-name "Google-Gmail"
        next
        edit 4
            set name "branch-sites"
            set mode sla
            set dst "192.168.0.0"
            config sla
                edit "srv1"
                    set id 1
                next
            end
            set priority-members 1 2
        next
        edit 5
            set name "internet"
            set mode load-balance
            set dst "all"
            config sla
                edit "Default_Google Search"
                    set id 1
                next
            end
            set priority-members  4 3 2 1
        next
    end
end

config router static
    edit 1
        set dst 1.1.0.0 255.255.0.0
        set gateway 1.1.2.1
        set device "port1"
    next
    edit 2
        set dst 2.2.0.0 255.255.0.0
        set gateway 2.2.2.1
        set device "port2"
    next
    edit 3
        set distance 1
        set sdwan-zone "virtual-wan-link"
    next
end

config firewall policy
    edit 4
        set name "SDWAN TO LAN"
        set srcintf "virtual-wan-link"
        set dstintf "port10"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 5
        set name "LAN TO SDWAN (interne)"
        set srcintf "port10"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "192.168.0.0"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 6
        set name "LAN TO INTERNET"
        set srcintf "port10"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end