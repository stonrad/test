config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FG-PARIS"
    set timezone 28
end

config system interface
    edit "port1"
        set mode static
        set vdom "root"
        set ip 1.1.0.2 255.255.255.0
        set allowaccess ping https ssh http fgfm
        set type physical
        set alias "ISP1"
    next
    edit "port2"
        set mode static
        set vdom "root"
        set ip 2.2.0.2 255.255.255.0
        set allowaccess ping ssh http
        set type physical
        set alias "ISP2"
        set snmp-index 2
    next
    edit "port10"
        set mode static
        set vdom "root"
        set ip 192.168.0.1 255.255.255.0
        set allowaccess ping ssh http
        set type physical
        set alias "LAN"
    next
end

config router static
    edit 1
        set gateway 1.1.0.1
        set device "port1"
        set comment "route par defaut pour internet"
    next
    edit 2
        set gateway 2.2.0.1
        set device "port2"
        set comment "route par defaut pour internet"
    next
     edit 3
        set dst 1.1.0.0 255.255.0.0
        set gateway 1.1.0.1
        set device "port1"
    next
    edit 4
        set dst 2.2.0.0 255.255.0.0
        set gateway 2.2.0.1
        set device "port2"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-ISP1"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set add-route disable
        set localid "FG-DC-ISP"
        set dpd on-idle
        set auto-discovery-sender enable
        set network-overlay enable
        set network-id 1
        set tunnel-search nexthop
        set ipv4-start-ip 10.254.1.1
        set ipv4-end-ip 10.254.1.250
        set ipv4-netmask 255.255.255.0
        set psksecret chutjesuisuneclesecrete
        set dpd-retrycount 4
        set dpd-retryinterval 2
    next
    edit "VPN-ISP2"
        set type dynamic
        set interface "port2"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set add-route disable
        set localid "FG-DC-ISP2"
        set dpd on-idle
        set auto-discovery-sender enable
        set network-overlay enable
        set network-id 2
        set ipv4-start-ip 10.254.2.1
        set ipv4-end-ip 10.254.2.250
        set ipv4-netmask 255.255.255.0
        set psksecret chutjesuisuneclesecrete
        set dpd-retrycount 4
        set dpd-retryinterval 2
    next
end

config system interface
    edit "VPN-ISP1"
        set vdom "root"
        set ip 10.254.1.254 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.254.1.253 255.255.255.0
        set role wan
        set interface "port1"
    next
    edit "VPN-ISP2"
        set vdom "root"
        set ip 10.254.2.254 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.254.2.253 255.255.255.0
        set role wan
        set interface "port2"
    next
end
    
config vpn ipsec phase2-interface
    edit "VPN-ISP1"
        set phase1name "VPN-ISP1"
        set proposal des-sha1 des-sha256
    next
    edit "VPN-ISP2"
        set phase1name "VPN-ISP2"
        set proposal des-sha1 des-sha256
    next
end

config firewall policy
purge
y
  edit 1
        set name "VPN TO LAN"
        set srcintf "VPN-ISP1" "VPN-ISP2"
        set dstintf "port10"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "LAN TO VPN"
        set srcintf "port10"
        set dstintf "VPN-ISP1" "VPN-ISP2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "VPN TO VPN"       
        set srcintf "VPN-ISP1" "VPN-ISP2"
        set dstintf "VPN-ISP1" "VPN-ISP2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
 
     next
     edit 4
        set name "VPN TO NET"
        set srcintf "port10" "VPN-ISP1" "VPN-ISP2"
        set dstintf "port1" "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end

config router community-list
    edit "dc-isp"
        config rule
            edit 1
                set action permit
                set match "65000:1"
            next
        end
    next
    edit "dc-isp2"
        config rule
            edit 1
                set action permit
                set match "65000:2"
            next
        end
    next
    edit "dc_sla_fail"
        config rule
            edit 1
                set action permit
                set match "65000:11"
            next
        end
    next
end

config router route-map
    edit "bgp_rt"
        config rule
            edit 1
                set match-community "dc-isp"
                set set-route-tag 1
            next
            edit 2
                set match-community "dc-isp2"
                set set-route-tag 2
            next
            edit 3
                set match-community "dc_sla_fail"
                set set-route-tag 11
            next
         end
    next
end

config router bgp
    set as 65000
    set router-id 200.0.0.2
    set keepalive-timer 3
    set holdtime-timer 9
    set ibgp-multipath enable
    set additional-path enable
    set graceful-restart enable
    config neighbor-group
        edit "GRP-ISP1"
            set advertisement-interval 5
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
            set remote-as 65000
            set route-map-in "bgp_rt"
            set additional-path send
            set route-reflector-client enable
        next
        edit "GRP-ISP2"
            set advertisement-interval 5
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
            set remote-as 65000
            set route-map-in "bgp_rt"
            set additional-path send
            set route-reflector-client enable
        next
    end
    config neighbor-range
        edit 1
            set prefix 10.254.1.0 255.255.255.0
            set neighbor-group "GRP-ISP1"
        next
        edit 2
            set prefix 10.254.2.0 255.255.255.0
            set neighbor-group "GRP-ISP2"
        next
    end
    config network
        edit 1
            set prefix 192.168.0.0 255.255.255.0
        next
    end
end
config firewall policy
    purge
    y
end

config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "VPN-ISP1"
        next
        edit 2
            set interface "VPN-ISP2"
            set cost 50
        next
    end
    config service
        edit 1
            set name "vers_branches_isp"
            set route-tag 1
            set src "all"
            set priority-members 1
        next
        edit 2
            set name "vers_branches_isp2"
            set route-tag 2
            set src "all"
            set priority-members 2
        next
        edit 10
            set name "vers-branches-all"
            set route-tag 11
            set src "all"
            set priority-members 1 2
        next
    end
end

config firewall policy
    edit 2
        set name "lan to sdwan"
        set srcintf "port10"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 4
        set name "branch to lan"
        set srcintf "virtual-wan-link"
        set dstintf "port10"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 5
        set name "branch to net"
        set srcintf "port10" "virtual-wan-link"
        set dstintf "port1" "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 6
        set name "branch to branch"
        set srcintf "virtual-wan-link"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end